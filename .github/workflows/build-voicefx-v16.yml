name: Build VoiceFX v1.6 module

# Builds VoiceFX-Dialer-Module-v1.6.zip: the released v1.4 APK with the new
# voice engine compiled in, re-signed, packaged with the install/uninstall
# scripts, verified, and published as a GitHub Release.
#
# Gates that must pass before anything is published:
#   1. offline DSP regression suite (pitch accuracy, periodicity/HNR, silence,
#      headroom) on the exact sources that go into the APK,
#   2. javac -> d8 -> smali round trip with an ABI gate that checks every
#      dialer method/field the new classes touch against the APK's own smali,
#   3. the rebuilt APK keeps its package name and dex set, and its patched dex
#      really differs from the base one,
#   4. the module zip is re-opened and validated (layout, exec bits, CRC,
#      module.prop bumped).
#
# Signing: set repo secrets VOICEFX_KS_B64 (base64 of voicefx-release.jks) and
# VOICEFX_KS_PASS to keep ONE key across releases (that is what makes updates
# installable in place). Without them a fresh key is generated for this run and
# published as a short-lived artifact — then installing over an older build
# needs an uninstall + reboot first.

on:
  push:
    tags:
      - "voicefx-v16-*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish/refresh the v1.6-voicefx GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: voicefx-v16
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Android SDK toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/platforms" || true
          "$ANDROID_HOME"/build-tools/*/d8 --version || true

      # ---- gate 1: the voice engine itself -------------------------------
      - name: Run the voice-engine regression suite
        run: |
          chmod +x tools/voicefx/selftest.sh
          OUT="$RUNNER_TEMP/selftest" tools/voicefx/selftest.sh

      # ---- gate 1b: install / uninstall behaviour ------------------------
      - name: Run the module install/uninstall simulation
        run: |
          chmod +x tools/voicefx/test-lifecycle.sh
          tools/voicefx/test-lifecycle.sh

      # ---- base module ---------------------------------------------------
      - name: Download the released v1.4 module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base
          gh release download v1.4-voicefx --repo "$GITHUB_REPOSITORY" \
            --pattern 'VoiceFX-Dialer-Module-v1.4.zip' --dir base
          ls -l base/
          md5sum base/VoiceFX-Dialer-Module-v1.4.zip

      # ---- signing key ---------------------------------------------------
      - name: Prepare the signing key
        env:
          VOICEFX_KS_B64: ${{ secrets.VOICEFX_KS_B64 }}
          VOICEFX_KS_PASS: ${{ secrets.VOICEFX_KS_PASS }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/signing" signing-out
          if [ -n "$VOICEFX_KS_B64" ]; then
            [ -n "$VOICEFX_KS_PASS" ] || { echo "VOICEFX_KS_PASS is empty" >&2; exit 1; }
            printf '%s' "$VOICEFX_KS_B64" | base64 -d > "$RUNNER_TEMP/signing/voicefx-release.jks"
            echo "KS_PASS=$VOICEFX_KS_PASS" >> "$GITHUB_ENV"
            echo "SNIPPET=same key as previous releases (secrets)" >> "$GITHUB_ENV"
            echo "Using the keystore from the repository secrets."
          else
            KS_PASS=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 24)
            echo "::add-mask::$KS_PASS"
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "SNIPPET=fresh key generated by this run" >> "$GITHUB_ENV"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/signing/voicefx-release.jks" \
              -alias voicefx -keyalg RSA -keysize 4096 -validity 10950 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=VoiceFX Dialer, OU=AxionVoice, O=Rocker14427c, L=Patna, ST=Bihar, C=IN"
            cp "$RUNNER_TEMP/signing/voicefx-release.jks" signing-out/
            CERT_SHA=$(keytool -list -v -keystore "$RUNNER_TEMP/signing/voicefx-release.jks" \
              -storepass "$KS_PASS" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//')
            cat > signing-out/KEYSTORE-README.txt <<EOF
          VoiceFX Dialer signing key - KEEP THIS FILE AND THE PASSWORD FOREVER
          ====================================================================
          keystore : voicefx-release.jks
          alias    : voicefx
          password : $KS_PASS
          cert SHA-256: $CERT_SHA

          Every future build of com.axionvoice.dialer must be signed with this key,
          otherwise Android refuses to upgrade the installed app.

          To make the next CI builds reuse it, add two repository secrets:
            VOICEFX_KS_B64  = base64 -w0 voicefx-release.jks
            VOICEFX_KS_PASS = the password above
          EOF
            echo "Generated a new signing key for this run (see the artifact)."
          fi

      # ---- gate 2-4: patch, sign, package, verify ------------------------
      - name: Build the v1.6 module
        run: |
          python3 tools/voicefx/build_v16.py \
            --v14-zip base/VoiceFX-Dialer-Module-v1.4.zip \
            --keystore "$RUNNER_TEMP/signing/voicefx-release.jks" \
            --ks-pass "$KS_PASS" \
            --ks-alias voicefx \
            --allow-different-cert \
            --out out
          echo "--- md5 ---"
          cat out/md5.txt
          echo "--- report ---"
          cat out/BUILD_REPORT_V16.md

      - name: Verify the module zip independently
        run: |
          python3 - <<'EOF'
          import hashlib, zipfile, sys
          z = zipfile.ZipFile("out/VoiceFX-Dialer-Module-v1.6.zip")
          names = z.namelist()
          assert "module.prop" in names, "module.prop missing"
          apks = [n for n in names if n.endswith(".apk")]
          assert len(apks) == 1, "expected exactly one APK, got %s" % apks
          apk = apks[0]
          assert z.getinfo(apk).file_size > 4_000_000, "APK too small"
          assert "priv-app" in apk, "APK is not installed as a priv-app: " + apk
          for n in ("customize.sh", "service.sh", "uninstall.sh", "gate.sh", "post-fs-data.sh"):
              assert n in names, n + " missing"
              assert (z.getinfo(n).external_attr >> 16) & 0o111, n + " not executable"
          assert any(n.startswith("system/etc/permissions/") and n.endswith(".xml") for n in names), \
              "no privapp permission allowlist"
          assert any(n.startswith("system/etc/default-permissions/") and n.endswith(".xml")
                     for n in names), "no default-permissions allowlist"
          prop = z.read("module.prop").decode()
          assert "version=v1.6" in prop and "id=axionvoice_dialer" in prop, prop
          for n in names:
              data = z.read(n)
              if n.endswith(".sh"):
                  assert b"\r\n" not in data, n + " has CRLF line endings"
          apkbytes = z.read(apk)
          base = open("base/VoiceFX-Dialer-Module-v1.4.zip", "rb")
          print("zip entries:", len(names))
          print("apk md5:", hashlib.md5(apkbytes).hexdigest())
          print("base module present:", bool(base))
          print("MODULE ZIP OK")
          EOF

      - name: Upload the module
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFX-Dialer-Module-v1.6
          path: out/
          retention-days: 30

      - name: Upload the signing key (only when generated here)
        if: ${{ hashFiles('signing-out/voicefx-release.jks') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: VOICEFX-SIGNING-KEY-DOWNLOAD-AND-KEEP
          path: signing-out/
          retention-days: 30

      # ---- publish -------------------------------------------------------
      - name: Publish the GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ZIP_MD5=$(awk '/VoiceFX-Dialer-Module-v1.6.zip/{print $1}' out/md5.txt)
          APK_MD5=$(awk '/AxionVoiceDialer.apk/{print $1}' out/md5.txt)
          CERT=$(grep -o 'Signing: [^\n]*' out/BUILD_REPORT_V16.md | head -1 || true)
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## VoiceFX Dialer — v1.6 (real voice conversion)

          The voice engine was rebuilt: a phase vocoder with identity phase locking,
          two-pass synthesis and an independent formant warp, plus a pitch tracker
          that measures your own register and aims the presets at an absolute
          fundamental instead of a blind offset.

          **Measured on a synthetic sustained vowel (perfectly periodic input, HNR +26 dB):**

          | preset | register | periodicity (HNR) |
          |---|---|---|
          | Girl | +9.00 st, F0 185 Hz | +19.9 dB |
          | Agent (L) | −2.36 st, F0 96 Hz | +23.7 dB |
          | Boy | −1.65 st, F0 100 Hz | +24.4 dB |
          | Child | +14.00 st, F0 247 Hz | +12.4 dB |

          For reference, the old engine scored **−0.1 dB** on the same Girl test —
          that number is the difference between "a vocoder" and "a voice". A pure
          tone passes through at 0.00 dB with 2 cents of pitch error, silence stays
          silent, and a hot input is limited instead of clipped.

          ### Install
          1. **If you have any older VoiceFX module installed**: uninstall it in the
             module manager, reboot, then continue. This build is signed with a
             $SNIPPET, so Android will not upgrade an older install in place.
          2. Install \`VoiceFX-Dialer-Module-v1.6.zip\` in ReSukiSU / Magisk / KernelSU.
          3. Reboot. \`service.sh\` grants the runtime permissions, makes VoiceFX the
             Phone app, and disables the stock in-call service while it holds the role.
          4. Check: \`adb logcat -s VoiceFXDialer\`.

          ### Uninstall
          Remove the module, reboot. The uninstaller returns the Phone role to the app
          that had it before install, uninstalls \`com.axionvoice.dialer\`, wipes its
          data, and a one-shot boot job finishes the removal if the APK was still
          mounted at uninstall time.

          ### Verify
          - zip md5: \`$ZIP_MD5\`
          - APK md5: \`$APK_MD5\`
          - package: \`com.axionvoice.dialer\` (side by side; the stock Phone app is untouched)
          - $CERT

          Build report with the full gate list: \`BUILD_REPORT_V16.md\`.
          NOTES
          if gh release view v1.6-voicefx --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.6-voicefx --repo "$GITHUB_REPOSITORY" --clobber \
              out/VoiceFX-Dialer-Module-v1.6.zip out/AxionVoiceDialer.apk out/md5.txt \
              out/BUILD_REPORT_V16.md
            gh release edit v1.6-voicefx --repo "$GITHUB_REPOSITORY" \
              --title "VoiceFX Dialer module v1.6 — real voice conversion" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create v1.6-voicefx --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "VoiceFX Dialer module v1.6 — real voice conversion" \
              --latest --notes-file "$RUNNER_TEMP/notes.md" \
              out/VoiceFX-Dialer-Module-v1.6.zip out/AxionVoiceDialer.apk out/md5.txt \
              out/BUILD_REPORT_V16.md
          fi
          gh release view v1.6-voicefx --repo "$GITHUB_REPOSITORY" --json url --jq .url

      - name: Summary
        if: always()
        run: |
          {
            echo "## VoiceFX v1.6"
            echo ""
            [ -f out/md5.txt ] && cat out/md5.txt
            echo ""
            echo "- module zip: \`VoiceFX-Dialer-Module-v1.6.zip\`"
            echo "- signing: ${{ env.SNIPPET }}"
            echo "- gates: DSP selftest, ABI gate, dex integrity, module layout"
          } >> "$GITHUB_STEP_SUMMARY"
